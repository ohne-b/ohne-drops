services:
  twitch-drops-miner:
    build: .
    container_name: twitch-drops-miner
    image: ohne-drops:local
    user: "1000:1000"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # For a reverse proxy, set one exact root URL. HTTPS enables Secure cookies.
    # This does not enable trust of forwarded client IP headers.
    # environment:
    #   PUBLIC_BASE_URL: https://drops.example.com
    restart: unless-stopped
