name: validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust and Dashboard Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build and check dashboard
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run format:check
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Check Rust and repository automation
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          node --test .github/scripts/test/*.test.mjs
          node .github/scripts/release.mjs read
          node .github/scripts/release.mjs artifacts "$(node .github/scripts/release.mjs read)"
          git diff --exit-code
      - name: Browser and accessibility tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: frontend/test-results/
          retention-days: 7

  docker:
    name: Docker Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: twitch-drops-miner:test
          cache-from: type=gha,scope=miner-${{ matrix.arch }}
          cache-to: type=gha,scope=miner-${{ matrix.arch }},mode=max
      - name: Check runtime, ownership and health without network access
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker run --rm --platform "$PLATFORM" --network none twitch-drops-miner:test --version
          docker run --rm --platform "$PLATFORM" --network none --entrypoint sh twitch-drops-miner:test -ec '
            test "$(id -u):$(id -g)" = "1000:1000"
            test -r /usr/share/licenses/twitch-drops-miner/LICENSE
            test -r /usr/share/licenses/twitch-drops-miner/NOTICE.md
            grep -Fq "Copyright (c) 2026 ohne-b (OhneB)" /usr/share/licenses/twitch-drops-miner/LICENSE
            grep -Fq "Copyright (c) 2024 DevilXD" /usr/share/licenses/twitch-drops-miner/NOTICE.md
            test -r /usr/share/licenses/twitch-drops-miner/dashboard/manrope.txt
            test ! -e /app/src
            ! command -v python
            ! command -v node
          '
          container=$(docker run -d --platform "$PLATFORM" --network none --read-only \
            --tmpfs /app/data:uid=1000,gid=1000 --tmpfs /app/logs:uid=1000,gid=1000 twitch-drops-miner:test)
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            if docker exec "$container" /usr/local/bin/twitch-drops-miner healthcheck; then exit 0; fi
            sleep 1
          done
          exit 1
