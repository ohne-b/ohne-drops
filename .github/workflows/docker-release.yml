name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already merged and validated on main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: rustup show
      - run: npm --prefix frontend ci
      - name: Verify reviewed version, current main and completed validation
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/release.mjs verify "$RELEASE_VERSION"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          conclusion=$(gh run list --workflow validation.yml --branch main --commit "$GITHUB_SHA" \
            --event push --limit 1 --json conclusion --jq '.[0].conclusion')
          test "$conclusion" = success
          test -z "$(git ls-remote origin "refs/tags/v${RELEASE_VERSION}")"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "image_version=${RELEASE_VERSION//+/_}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.image_version }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=miner-amd64
            type=gha,scope=miner-arm64
      - name: Publish immutable tag and generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_VERSION: ${{ steps.release.outputs.image_version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "v${RELEASE_VERSION}" --target "$GITHUB_SHA" --generate-notes \
            --title "${RELEASE_VERSION}" "${flags[@]}"
          if [[ "$PRERELEASE" == false ]]; then
            docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${IMAGE_VERSION}"
          fi
