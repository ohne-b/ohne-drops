name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already merged and validated on main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: rustup show
      - run: npm --prefix frontend ci
      - name: Verify reviewed version, current main and completed validation
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          node .github/scripts/release.mjs verify "$RELEASE_VERSION"
          remote_main=$(git ls-remote origin refs/heads/main)
          test "$(cut -f1 <<< "$remote_main")" = "$GITHUB_SHA"
          conclusion=$(gh run list --workflow validation.yml --branch main --commit "$GITHUB_SHA" \
            --limit 20 --json event,conclusion --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].conclusion')
          test "$conclusion" = success
          remote_tag=$(git ls-remote origin "refs/tags/v${RELEASE_VERSION}")
          test -z "$remote_tag"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            node .github/scripts/release.mjs images "$RELEASE_VERSION"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "prerelease=$(node .github/scripts/release.mjs prerelease "$RELEASE_VERSION")" >> "$GITHUB_OUTPUT"
          node .github/scripts/release.mjs artifacts "$RELEASE_VERSION"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Authenticate to Docker Hub when configured
        if: vars.DOCKERHUB_IMAGE != ''
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME repository variable}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN repository secret}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=miner-amd64
            type=gha,scope=miner-arm64
      - name: Publish release with manifest and reviewed notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_TAGS: ${{ steps.release.outputs.tags }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          # Upload to a draft first: the public release must never lack latest.json.
          gh release create "v${RELEASE_VERSION}" --target "$GITHUB_SHA" --draft \
            --title "Twitch miner v${RELEASE_VERSION}" --notes-file dist/release/notes.md \
            dist/release/latest.json
          gh release download "v${RELEASE_VERSION}" --pattern latest.json --dir dist/verify
          cmp dist/release/latest.json dist/verify/latest.json
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "v${RELEASE_VERSION}" --draft=false --prerelease --latest=false
          else
            gh release edit "v${RELEASE_VERSION}" --draft=false --latest
            # Never advertise a stable image before its release and manifest are public.
            while IFS= read -r image; do
              docker buildx imagetools create --tag "${image%:*}:latest" "$image"
            done <<< "$IMAGE_TAGS"
          fi
