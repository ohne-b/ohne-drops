name: Publish edge image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: rustup show
      - run: npm --prefix frontend ci
      - name: Verify current main and completed validation
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_main=$(git ls-remote origin refs/heads/main)
          test "$(cut -f1 <<< "$remote_main")" = "$GITHUB_SHA"
          conclusion=$(gh run list --workflow validation.yml --branch main --commit "$GITHUB_SHA" \
            --limit 20 --json event,conclusion --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].conclusion')
          test "$conclusion" = success
          echo "version=$(node .github/scripts/release.mjs read)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ohne-b/twitch-drops-miner:edge
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=miner-amd64
            type=gha,scope=miner-arm64
