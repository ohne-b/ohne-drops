name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Next SemVer version, for example 0.2.0 or 0.2.0-rc.1'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # A maintainer token lets the new PR trigger its normal validation checks.
          token: ${{ secrets.PUBLISHER_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: rustup show
      - run: npm --prefix frontend ci
      - name: Prepare version and lockfile
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node .github/scripts/release.mjs bump "$RELEASE_VERSION"
      - name: Open draft release pull request
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          branch="feat/release-${RELEASE_VERSION}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): prepare ${RELEASE_VERSION}"
          git push origin "$branch"
          printf '%s\n' 'Updates the Cargo package and lockfile version together.' '' \
            'Add a concise CHANGELOG.md entry for this version. Keep this PR in draft until validation and independent adversarial review pass. After merging, run Publish release from main with this version; latest.json is generated and attached automatically.' > /tmp/release-body.md
          gh pr create --draft --base main --head "$branch" --title "chore(release): prepare ${RELEASE_VERSION}" --body-file /tmp/release-body.md
